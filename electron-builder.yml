appId: io.github.cyenite.openterm5
productName: OpenTerm5
copyright: Copyright © The OpenTerm5 contributors
icon: build/icon.png
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: cyenite
  repo: OpenTerm5
protocols:
  - name: OpenTerm5
    schemes: [openterm5]
linux:
  icon: build/icons
  target: [AppImage, deb]
  category: Office
  maintainer: The OpenTerm5 contributors
mac:
  # Squirrel.Mac updates from the zip, not the dmg.
  target: [dmg, zip]
  category: public.app-category.finance
win:
  target: [nsis]
